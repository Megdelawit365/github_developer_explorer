<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GITHUB DEVELOPER EXPLORER</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>GITHUB DEVELOPER EXPLORER</h1>
    <div class="search-bar">
        <input type="text" class="search-input" placeholder="SEARCH FOR A USERNAME">
        <button class="search-btn">SEARCH</button>
    </div>
    <div class="main">
        <h2>PROFILE INFORMATION</h2>
        <div class="loading-profile"></div>
        <div class="error profile-error"></div>
        <div class="top">
            <div class="profile-pic"></div>
            <div class="profile-info">
            </div>
        </div>
        <h2>REPOSITORY INFORMATION</h2>
        <div class="loading-repo"></div>

        <div class="repo-info"></div>
    </div>

    <script src="/js/app.js" type="module"></script>
</body>

</html>
